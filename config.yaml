# Central config for the gated pipeline — fully offline.

llm:
  model_path: "models/n-atlas-q4_k_m.gguf"
  n_ctx: 2048
  n_threads: 4       
  n_gpu_layers: 0     
  temperature: 0.1
  repeat_penalty: 1.12
  max_new_tokens: 200

languages:
  yo:
    name: "Yoruba"
    lexicon_path: "resources/lexicons/yo.txt"
    kenlm_path: null
    auto_apply_threshold: null   # never auto-apply — see README
    diacritics: "ẹ ọ ṣ (+ tone marks: ´ acute / ` grave / unmarked mid)"
  ig:
    name: "Igbo"
    lexicon_path: "resources/lexicons/ig.txt"
    kenlm_path: null
    auto_apply_threshold: 0.9
    diacritics: "ị ọ ụ ṅ (underdots), digraphs gb/gh/kp/kw/nw/ny/ch/sh"
  ha:
    name: "Hausa"
    lexicon_path: "resources/lexicons/ha.txt"
    kenlm_path: null
    auto_apply_threshold: 0.9
    diacritics: "ɓ ɗ ƙ ƴ (hooked letters); tone/length usually unmarked in boko"

tier1:
  oov_ratio_flag_threshold: 0.2
  perplexity_zscore_flag_threshold: 1.5
  fuzzy_match_enabled: true
  fuzzy_match_threshold: 0.82   # 0-1 spelling-similarity cutoff (difflib ratio)

# Disabled — requires a ~1.8GB download of LaBSE, incompatible with offline use.
semantic:
  enabled: false
  cache_dir: "resources/embedding_cache"
  oov_accept_similarity: 0.82
  drift_guard_similarity: 0.75